<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الحماية - Zeralda ERP</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/dark_theme.css">
    <script src="shared/theme_manager.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --ink: #f1f5f9;
            --muted: #94a3b8;
            --accent: #d36b2e;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
        }
        .header h1 { font-size: 24px; font-weight: 700; }
        .header h1 i { color: var(--accent); margin-left: 8px; }
        .refresh-btn {
            padding: 10px 20px; background: var(--accent); color: white;
            border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
            font-weight: 600; transition: opacity 0.2s;
        }
        .refresh-btn:hover { opacity: 0.85; }
        .refresh-btn:disabled { opacity: 0.5; cursor: wait; }

        /* Summary cards */
        .summary-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px; margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card-bg); border-radius: var(--radius); padding: 20px;
            border: 1px solid var(--border); text-align: center;
        }
        .stat-card .icon { font-size: 28px; margin-bottom: 8px; }
        .stat-card .value { font-size: 32px; font-weight: 700; }
        .stat-card .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .stat-card.success .icon { color: var(--success); }
        .stat-card.warning .icon { color: var(--warning); }
        .stat-card.error .icon { color: var(--error); }
        .stat-card.accent .icon { color: var(--accent); }

        /* Sections */
        .section {
            background: var(--card-bg); border-radius: var(--radius); padding: 20px;
            border: 1px solid var(--border); margin-bottom: 20px;
        }
        .section h2 {
            font-size: 18px; font-weight: 600; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .section h2 i { color: var(--accent); }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: right; padding: 10px 12px; color: var(--muted);
             border-bottom: 2px solid var(--border); font-weight: 600; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: rgba(255,255,255,0.03); }

        /* Badges */
        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 11px; font-weight: 600;
        }
        .badge.active { background: rgba(16,185,129,0.15); color: var(--success); }
        .badge.inactive { background: rgba(148,163,184,0.15); color: var(--muted); }
        .badge.revoked { background: rgba(239,68,68,0.15); color: var(--error); }
        .badge.high { background: rgba(239,68,68,0.2); color: var(--error); }
        .badge.medium { background: rgba(245,158,11,0.2); color: var(--warning); }
        .badge.low { background: rgba(148,163,184,0.15); color: var(--muted); }

        /* Suspicious alert */
        .alert {
            padding: 12px 16px; border-radius: 8px; margin-bottom: 8px;
            display: flex; align-items: flex-start; gap: 10px; font-size: 13px;
        }
        .alert.high { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
        .alert.medium { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }
        .alert i { font-size: 16px; margin-top: 2px; }
        .alert.high i { color: var(--error); }
        .alert.medium i { color: var(--warning); }

        .empty { text-align: center; color: var(--muted); padding: 40px; }

        .loading { text-align: center; padding: 40px; color: var(--muted); }
        .loading i { font-size: 32px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .ts { color: var(--muted); font-size: 11px; }
        code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-shield-halved"></i> لوحة تحكم الحماية والاستخدام</h1>
        <button class="refresh-btn" id="refreshBtn" onclick="loadStats()">
            <i class="fas fa-rotate"></i> تحديث
        </button>
    </div>

    <div id="content">
        <div class="loading">
            <i class="fas fa-spinner"></i>
            <p>جارٍ تحميل البيانات...</p>
        </div>
    </div>

    <script>
    function _apiBase() {
        return window.location.origin;
    }

    function _tsFmt(ts) {
        if (!ts) return '—';
        var d = new Date(ts * 1000);
        return d.toLocaleString('ar-DZ', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function _timeAgo(ts) {
        if (!ts) return '—';
        var diff = Math.floor(Date.now() / 1000) - ts;
        if (diff < 60) return 'منذ ' + diff + ' ثانية';
        if (diff < 3600) return 'منذ ' + Math.floor(diff / 60) + ' دقيقة';
        if (diff < 86400) return 'منذ ' + Math.floor(diff / 3600) + ' ساعة';
        return 'منذ ' + Math.floor(diff / 86400) + ' يوم';
    }

    async function loadStats() {
        var btn = document.getElementById('refreshBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ...';
        try {
            var resp = await fetch(_apiBase() + '/api/license/usage-stats', {
                headers: { 'X-Requested-With': 'XMLHttpRequest', 'X-Session-Token': localStorage.getItem('zeralda-session-token') || '' },
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            var data = await resp.json();
            renderStats(data);
        } catch (e) {
            document.getElementById('content').innerHTML =
                '<div class="section"><h2><i class="fas fa-exclamation-triangle"></i> خطأ</h2>' +
                '<p>فشل تحميل البيانات: ' + e.message + '</p>' +
                '<p>تأكد من تسجيل الدخول كأدمن.</p></div>';
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-rotate"></i> تحديث';
        }
    }

    function renderStats(data) {
        var s = data.summary || {};
        var html = '';

        // ── Summary cards ──
        html += '<div class="summary-grid">';
        html += _statCard('fa-devices', s.totalDevices || 0, 'إجمالي الأجهزة', 'accent');
        html += _statCard('fa-circle-check', s.activeDevices24h || 0, 'نشط (24 ساعة)', 'success');
        html += _statCard('fa-clock', s.activeDevices7d || 0, 'نشط (7 أيام)', 'success');
        html += _statCard('fa-key', s.activeLicenses || 0, 'تراخيص نشطة', 'success');
        html += _statCard('fa-ban', s.revokedLicenses || 0, 'تراخيص ملغاة', 'error');
        html += _statCard('fa-database', s.totalLicenses || 0, 'إجمالي التراخيص', 'accent');
        html += _statCard('fa-chart-line', s.events24h || 0, 'أحداث (24 ساعة)', 'warning');
        html += _statCard('fa-list', s.totalEvents || 0, 'إجمالي الأحداث', 'warning');
        html += '</div>';

        // ── Suspicious activity ──
        var susp = data.suspicious || [];
        html += '<div class="section">';
        html += '<h2><i class="fas fa-triangle-exclamation"></i> النشاط المشبوه (' + susp.length + ')</h2>';
        if (susp.length === 0) {
            html += '<div class="empty"><i class="fas fa-circle-check" style="font-size:32px;color:var(--success);margin-bottom:8px;"></i>' +
                    '<p>لا يوجد نشاط مشبوه ✅</p></div>';
        } else {
            susp.forEach(function(a) {
                html += '<div class="alert ' + a.severity + '">' +
                    '<i class="fas fa-' + (a.severity === 'high' ? 'circle-exclamation' : 'triangle-exclamation') + '"></i>' +
                    '<div><span class="badge ' + a.severity + '">' + a.type + '</span><br>' +
                    '<span>' + a.detail + '</span></div></div>';
            });
        }
        html += '</div>';

        // ── Devices ──
        var devices = data.devices || [];
        html += '<div class="section">';
        html += '<h2><i class="fas fa-microchip"></i> الأجهزة (' + devices.length + ')</h2>';
        if (devices.length === 0) {
            html += '<div class="empty">لا توجد أجهزة مسجلة</div>';
        } else {
            html += '<table><thead><tr>' +
                '<th>HW ID</th><th>الهاتف</th><th>التراخيص</th>' +
                '<th>الأحداث</th><th>آخر ظهور</th><th>الحالة</th>' +
                '</tr></thead><tbody>';
            devices.forEach(function(d) {
                html += '<tr>' +
                    '<td><code>' + (d.hwId || '—') + '</code></td>' +
                    '<td>' + (d.phone || '—') + '</td>' +
                    '<td>' + (d.licenseKeys || []).length + '</td>' +
                    '<td>' + (d.eventCount || 0) + '</td>' +
                    '<td class="ts">' + _timeAgo(d.lastSeen) + '</td>' +
                    '<td><span class="badge ' + d.status + '">' + (d.status === 'active' ? 'نشط' : 'خامل') + '</span></td>' +
                    '</tr>';
            });
            html += '</tbody></table>';
        }
        html += '</div>';

        // ── Licenses ──
        var lics = data.licenseSummary || [];
        html += '<div class="section">';
        html += '<h2><i class="fas fa-id-card"></i> التراخيص (' + lics.length + ')</h2>';
        if (lics.length === 0) {
            html += '<div class="empty">لا توجد تراخيص</div>';
        } else {
            html += '<table><thead><tr>' +
                '<th>مفتاح الترخيص</th><th>مفتاح Keygen</th><th>العميل</th>' +
                '<th>الأجهزة</th><th>الحد</th><th>الانتهاء</th><th>الحالة</th>' +
                '</tr></thead><tbody>';
            lics.forEach(function(l) {
                var expStr = l.expiresAt ? _tsFmt(l.expiresAt) : 'دائم';
                var statusBadge = l.revoked ?
                    '<span class="badge revoked">ملغى</span>' :
                    (l.hwBound ? '<span class="badge active">مربوط</span>' : '<span class="badge inactive">غير مربوط</span>');
                html += '<tr>' +
                    '<td><code>' + l.licenseKey + '</code></td>' +
                    '<td><code>' + (l.keygenKey || '—') + '</code></td>' +
                    '<td>' + (l.customer || '—') + '</td>' +
                    '<td>' + l.activeDevices + '</td>' +
                    '<td>' + l.maxDevices + '</td>' +
                    '<td class="ts">' + expStr + '</td>' +
                    '<td>' + statusBadge + '</td>' +
                    '</tr>';
            });
            html += '</tbody></table>';
        }
        html += '</div>';

        // ── Recent events ──
        var events = data.recentEvents || [];
        html += '<div class="section">';
        html += '<h2><i class="fas fa-clock-rotate-left"></i> آخر الأحداث (' + events.length + ')</h2>';
        if (events.length === 0) {
            html += '<div class="empty">لا توجد أحداث</div>';
        } else {
            html += '<table><thead><tr>' +
                '<th>الوقت</th><th>النوع</th><th>الترخيص</th><th>HW ID</th><th>IP</th>' +
                '</tr></thead><tbody>';
            events.forEach(function(e) {
                var typeIcon = {
                    'activation': 'fa-circle-check',
                    'heartbeat': 'fa-heart-pulse',
                    'revocation': 'fa-ban',
                    'tampering': 'fa-bug',
                    'hw_mismatch': 'fa-triangle-exclamation',
                    'max_devices': 'fa-users',
                    'login_with_key': 'fa-right-to-bracket',
                }[e.type] || 'fa-circle';
                html += '<tr>' +
                    '<td class="ts">' + _tsFmt(e.ts) + '</td>' +
                    '<td><i class="fas ' + typeIcon + '"></i> ' + e.type + '</td>' +
                    '<td><code>' + (e.licenseKey || '—') + '</code></td>' +
                    '<td><code>' + (e.hwId || '—') + '</code></td>' +
                    '<td>' + (e.ip || '—') + '</td>' +
                    '</tr>';
            });
            html += '</tbody></table>';
        }
        html += '</div>';

        document.getElementById('content').innerHTML = html;
    }

    function _statCard(icon, value, label, color) {
        return '<div class="stat-card ' + color + '">' +
            '<div class="icon"><i class="fas ' + icon + '"></i></div>' +
            '<div class="value">' + value + '</div>' +
            '<div class="label">' + label + '</div></div>';
    }

    // Auto-load on page ready
    loadStats();
    // Auto-refresh every 30 seconds
    setInterval(loadStats, 30000);
    </script>
</body>
</html>
