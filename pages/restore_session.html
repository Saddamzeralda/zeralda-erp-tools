<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>استعادة الجلسة</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f0f9ff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.card{background:#fff;border-radius:12px;padding:40px;max-width:500px;box-shadow:0 4px 20px rgba(0,0,0,0.1);text-align:center}
h1{color:#1e40af;margin:0 0 20px;font-size:22px}
.btn{background:#2563eb;color:#fff;border:none;padding:12px 30px;border-radius:8px;font-size:16px;cursor:pointer;margin:10px 5px}
.btn:hover{background:#1d4ed8}
.status{margin:15px 0;font-weight:bold;padding:10px;border-radius:8px}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid #dbeafe;border-top:3px solid #2563eb;border-radius:50%;animation:spin 1s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
<h1>استعادة الجلسة</h1>
<div id="status" class="status" style="background:#dbeafe;color:#1e40af"><span class="spinner"></span>جارٍ المعالجة...</div>
<button class="btn" onclick="restoreSession()">استعادة الآن</button>
<button class="btn" style="background:#64748b" onclick="location.href='login.html'">تسجيل دخول عادي</button>
</div>
<script>
var SESSION_TOKEN = '2Ltp-jhb8sXtGPPftSNs0ZIXz8q0wW-rxOhkeX3yAJM';

async function restoreSession(){
  var status = document.getElementById('status');
  try {
    document.cookie = "zeralda-auth-token=" + encodeURIComponent(SESSION_TOKEN) + "; path=/; max-age=2592000; SameSite=Lax";
    try { localStorage.setItem('zeralda-auth-token', SESSION_TOKEN); } catch(e){}
    function trySetZS(retries) {
      if (window.ZS && window.ZS.setItem) {
        try { window.ZS.setItem('zeralda-auth-token', SESSION_TOKEN); return true; } catch(e){}
      }
      if (retries > 0) setTimeout(function(){ trySetZS(retries-1); }, 200);
      return false;
    }
    trySetZS(10);
    status.innerHTML = '<span class="spinner"></span>جارٍ التحقق...';
    var resp = await fetch('/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + SESSION_TOKEN, 'X-Session-Token': SESSION_TOKEN, 'X-Requested-With': 'XMLHttpRequest' }
    });
    if (resp.ok) {
      status.className = 'status ok';
      status.innerHTML = '✅ تم استعادة الجلسة! جارٍ التحويل...';
      setTimeout(function(){ trySetZS(0); }, 300);
      setTimeout(function(){ trySetZS(0); }, 800);
      setTimeout(function(){ window.location.href = 'zeralda_erp_dashboard.html'; }, 1500);
    } else {
      status.className = 'status err';
      status.innerHTML = '❌ فشل (' + resp.status + ')';
    }
  } catch(e) {
    status.className = 'status err';
    status.innerHTML = '❌ خطأ: ' + e.message;
  }
}
window.onload = function(){ setTimeout(restoreSession, 300); };
</script>
</body>
</html>
