<!DOCTYPE html>
<html>
<head>
    <script src="shared/zeralda_db.js?v=20261017_v10"></script>
    <script src="shared/theme_manager.js"></script>
    <script src="shared/company_storage.js?v=20261017_v10"></script>
  <meta charset="utf-8">
  <title>Google Sign-In - Zeralda ERP</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f8fafc; display: flex;
           align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; }
    .spinner { width: 48px; height: 48px; border: 4px solid #e5e7eb;
               border-top-color: #3b82f6; border-radius: 50%;
               animation: spin 1s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { color: #374151; font-size: 16px; font-weight: 500; }
    .err { color: #ef4444; font-size: 14px; margin-top: 12px; max-width: 400px; text-align: center; }
  </style>
    <link rel="stylesheet" href="styles/dark_theme.css">
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="msg">Processing Google Sign-In...</div>
  <div class="err" id="err"></div>

  <script>
  (function () {
    'use strict';

    // إصلاح: استخدام مفاتيح مع معرف المستخدم (متوافق مع google_sync.js)
    function getActiveUserId() {
      // 1) zeralda-current-user
      try {
        var cu = JSON.parse(ZS.getItem('zeralda-current-user') || '{}');
        if (cu && cu.id) return String(cu.id);
      } catch (_) {}
      // 2) zeralda-settings.activeUserId
      try {
        var s = JSON.parse(ZS.getItem('zeralda-settings') || '{}');
        if (s && s.activeUserId) return String(s.activeUserId);
      } catch (_) {}
      return 'default';
    }

    var _uid = getActiveUserId();
    var GTOKEN_KEY = 'zeralda-google-token::' + _uid;
    var GPROFILE_KEY = 'zeralda-google-profile::' + _uid;
    // أيضاً نحفظ في المفتاح العام للتوافق مع الإصدارات القديمة
    var GTOKEN_KEY_GLOBAL = 'zeralda-google-token';
    var GPROFILE_KEY_GLOBAL = 'zeralda-google-profile';

    function setMsg(text, isError) {
      var m = document.getElementById('msg');
      var e = document.getElementById('err');
      var s = document.getElementById('spinner');
      if (m) m.textContent = text;
      if (isError) {
        if (s) s.style.display = 'none';
        if (e) e.textContent = text;
        if (m) m.textContent = 'Google Sign-In failed.';
      }
    }

    function redirectBack() {
      var from = ZS.getItem('zeralda-oauth-redirect-from') || '/settings.html';
      ZS.removeItem('zeralda-oauth-redirect-from');
      ZS.removeItem('zeralda-oauth-redirect-time');
      window.location.href = from;
    }

    function saveToken(token, expiresIn) {
      var nowMs = Date.now();
      var data = {
        access_token: token,
        expires_in: expiresIn,
        issued_at: nowMs,
        expires_at: nowMs + (parseInt(expiresIn || '3600', 10) * 1000)
      };
      var dataStr = JSON.stringify(data);
      // حفظ في المفتاح مع معرف المستخدم (الأساسي)
      ZS.setItem(GTOKEN_KEY, dataStr);
      // حفظ في المفتاح العام للتوافق
      ZS.setItem(GTOKEN_KEY_GLOBAL, dataStr);
      ZS.setItem('zeralda-google-token::default', dataStr);
    }

    function fetchAndSaveProfile(token, cb) {
      fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(function (r) {
        return r.ok ? r.json() : null;
      }).then(function (info) {
        if (info) {
          var profileStr = JSON.stringify({
            email: info.email, name: info.name,
            picture: info.picture, sub: info.sub
          });
          // حفظ في المفتاح مع معرف المستخدم (الأساسي)
          ZS.setItem(GPROFILE_KEY, profileStr);
          // حفظ في المفتاح العام للتوافق
          ZS.setItem(GPROFILE_KEY_GLOBAL, profileStr);
          ZS.setItem('zeralda-google-profile::default', profileStr);
          if (info.email) {
            ZS.setItem('zeralda-google-token::' + info.email, ZS.getItem(GTOKEN_KEY));
            ZS.setItem('zeralda-google-profile::' + info.email, profileStr);
          }
          try {
            var sRaw = ZS.getItem('zeralda-settings');
            var sObj = sRaw ? JSON.parse(sRaw) : {};
            sObj.google = sObj.google || {};
            sObj.google.autoBackupEnabled = true;
            sObj.google.connectedEmail = info.email || '';
            ZS.setItem('zeralda-settings', JSON.stringify(sObj));
          } catch (_) {}
        }
        cb(info);
      }).catch(function () { cb(null); });
    }

    var hash = window.location.hash;

    // Clear hash from URL immediately
    if (hash) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    if (!hash || hash.indexOf('access_token=') === -1) {
      // Check for error
      var errMatch = hash && hash.match(/[#&]error=([^&]*)/);
      if (errMatch) {
        setMsg('Google denied access: ' + decodeURIComponent(errMatch[1]), true);
        setTimeout(redirectBack, 3000);
      } else {
        setMsg('No token received.', true);
        setTimeout(redirectBack, 2000);
      }
      return;
    }

    var params = new URLSearchParams(hash.substring(1));
    var token = params.get('access_token');
    var expiresIn = params.get('expires_in');
    var state = params.get('state');

    // State validation
    var savedState = ZS.getItem('zeralda-google-oauth-state');
    ZS.removeItem('zeralda-google-oauth-state');
    if (savedState && (!state || state !== savedState)) {
      setMsg('Security check failed (state mismatch). Please try again.', true);
      setTimeout(redirectBack, 3000);
      return;
    }

    if (!token) {
      setMsg('No token in response.', true);
      setTimeout(redirectBack, 2000);
      return;
    }

    // Save token
    saveToken(token, expiresIn);
    ZS.setItem('zeralda-drive-auto-sync-on-login', 'true');

    // Fetch profile then redirect back
    setMsg('Signed in! Redirecting...');
    fetchAndSaveProfile(token, function (info) {
      var sessionToken = ZS.getItem('zeralda-session-token');
      var from = ZS.getItem('zeralda-oauth-redirect-from') || '';
      var isFromLogin = from.indexOf('login.html') !== -1 || !sessionToken;

      if (isFromLogin) {
        setMsg('Authenticating with Zeralda ERP...');
        fetch('/api/auth/google-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
          body: JSON.stringify({ google_token: token })
        })
        .then(function(res) { return res.json().catch(function() { return {}; }); })
        .then(function(data) {
          if (data && data.ok && data.session_token) {
            ZS.setItem('zeralda-session-token', data.session_token);
            if (data.user) {
              ZS.setItem('zeralda-current-user', JSON.stringify(data.user));
              var uId = data.user.id || data.user.email || data.user.username;
              if (uId) {
                ZS.setItem('zeralda-google-token::' + uId, ZS.getItem(GTOKEN_KEY));
                if (info) ZS.setItem('zeralda-google-profile::' + uId, JSON.stringify(info));
              }
            }
            ZS.setItem('zeralda-drive-auto-sync-on-login', 'true');
            window.location.href = '/zeralda_erp_dashboard.html';
          } else {
            redirectBack();
          }
        })
        .catch(function() {
          redirectBack();
        });
      } else {
        redirectBack();
      }
    });
  })();
  </script>
</body>
</html>
