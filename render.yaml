services:
  - type: web
    name: zeralda-erp
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_OPEN_BROWSER
        value: "false"
      - key: ENABLE_REMOTE_TUNNEL
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 180070533961-1douevfros9h0smkg249b0fgmmhfesjb.apps.googleusercontent.com
      - key: ALLOWED_ORIGINS
        value: https://zeralda-erp.onrender.com
