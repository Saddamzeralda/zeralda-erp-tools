services:
  - type: web
    name: zeralda-erp
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_OPEN_BROWSER
        value: "false"
      - key: ENABLE_REMOTE_TUNNEL
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
