version: '3.8'

services:
  erp:
    build: .
    container_name: zeralda_erp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=production
      - AUTO_OPEN_BROWSER=false
      - ENABLE_REMOTE_TUNNEL=false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # Optional Postgres database service (if using PostgreSQL instead of JSON store)
