<!-- Zeralda ERP — Shared Header & Sidebar (v2026-02-26) -->
<div class="header" role="banner">
  <!-- ROW 1: logo / controls -->
  <div class="header-top">
    <div class="header-left">
      <button class="sidebar-toggle-btn" onclick="toggleSidebarCollapse()"
              data-en-title="Toggle Sidebar"
              data-ar-title="تبديل القائمة الجانبية"
              data-fr-title="Basculer le menu latéral"
              title="Toggle Sidebar" aria-label="Toggle sidebar visibility">
        <i class="fas fa-bars" id="sidebarToggleIcon"></i>
      </button>
      <i class="fas fa-bars mobile-menu-btn" onclick="toggleSidebar()" style="display:none;"></i>
      <div class="logo">
        <img src="logo.png" alt="Company Logo" class="logo-image" id="mainLogo"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <i class="fas fa-building" style="display:none;"></i>
        <div class="logo-brand">
          <span id="app-title">Zeralda ERP Tool</span>
        </div>
      </div>
    </div>
    <div class="header-middle">
      <div class="header-row row-1">
        <div class="company-switcher"
             data-en-title="Active Company"
             data-ar-title="الشركة النشطة"
             data-fr-title="Entreprise active"
             title="Active Company">
          <i class="fas fa-building" aria-hidden="true"></i>
          <select id="companySwitcher" onchange="onHeaderCompanySwitch(this.value)" aria-label="Switch company"></select>
        </div>
      </div>
      <div class="header-row row-2">
        <div class="lang-datetime-row">
          <div class="language-indicator"
               data-en-title="Language"
               data-ar-title="اللغة"
               data-fr-title="Langue"
               title="Language">
            <i class="fas fa-language" aria-hidden="true"></i>
            <select id="headerLanguageSelect" onchange="window.onHeaderLanguageSwitch && window.onHeaderLanguageSwitch(this.value)" aria-label="Switch language">
              <option value="en">English</option>
              <option value="ar">العربية</option>
              <option value="fr">Français</option>
            </select>
          </div>
          <div class="datetime-display">
            <div class="date-display"><i class="fas fa-calendar-alt"></i><span id="currentDate"></span></div>
            <div class="analog-clock" id="headerAnalogClock">
              <svg viewBox="0 0 100 100" width="48" height="48">
                <circle cx="50" cy="50" r="48" class="clock-face"/>
                <g class="clock-marks" id="clockMarks"></g>
                <g id="clockHourHand" class="clock-hand hour-hand"><line x1="50" y1="50" x2="50" y2="28"/></g>
                <g id="clockMinuteHand" class="clock-hand minute-hand"><line x1="50" y1="50" x2="50" y2="20"/></g>
                <g id="clockSecondHand" class="clock-hand second-hand"><line x1="50" y1="50" x2="50" y2="16"/></g>
                <circle cx="50" cy="50" r="3" class="clock-center"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="header-right">
      <div class="header-row row-1">
        <button id="headerThemeToggleBtn" class="header-fullscreen-btn" type="button"
                onclick="window.toggleZeraldaTheme && window.toggleZeraldaTheme()"
                data-en-title="Toggle Dark / Light Mode"
                data-ar-title="تبديل الوضع الداكن / الفاتح"
                data-fr-title="Basculer Mode Sombre / Clair"
                title="تبديل الوضع الداكن / الفاتح"
                aria-label="Toggle Dark / Light Mode"
                style="color:#fbbf24;">
          <i class="fas fa-moon" id="headerThemeIcon" aria-hidden="true"></i>
        </button>
        <button id="headerUniversalScanBtn" class="header-fullscreen-btn" type="button"
                onclick="window.openUniversalOcrModal && window.openUniversalOcrModal()"
                data-en-title="AI Smart Scan (Camera / File)"
                data-ar-title="المسح الضوئي الذكي (كاميرا / ملف)"
                data-fr-title="Scan IA Intelligent (Caméra / Fichier)"
                title="المسح الضوئي الذكي (كاميرا / ملف)"
                aria-label="Universal AI Scan"
                style="color:#38bdf8;">
          <i class="fas fa-camera" aria-hidden="true"></i>
        </button>
        <button id="headerHostShareBtn" class="header-fullscreen-btn" type="button"
                onclick="window.showNetworkHostingModal && window.showNetworkHostingModal()"
                data-en-title="Network & Remote Host"
                data-ar-title="الاستضافة والربط الشبكي"
                data-fr-title="Hébergement Réseau & Distant"
                title="الاستضافة والربط الشبكي"
                aria-label="Network & Remote Host"
                style="color:#38bdf8;">
          <i class="fas fa-network-wired" aria-hidden="true"></i>
        </button>
        <button id="headerFullscreenBtn" class="header-fullscreen-btn" type="button"
                onclick="toggleHeaderFullscreen()"
                data-en-title="Fullscreen (F11)"
                data-ar-title="ملء الشاشة (F11)"
                data-fr-title="Plein ecran (F11)"
                title="Fullscreen (F11)"
                aria-label="Fullscreen (F11)">
          <span class="header-fullscreen-shortcut" aria-hidden="true">F11</span>
          <i class="fas fa-expand" aria-hidden="true"></i>
        </button>
        <div class="user-info" id="layoutUserInfo">
          <div class="user-avatar" id="layoutUserAvatar">US</div>
          <div>
            <div style="font-weight: 600;" class="user-name" id="layoutUserName"
                 data-en="User" data-ar="مستخدم" data-fr="Utilisateur">User</div>
          </div>
        </div>
      </div>
    </div>
  </div><!-- /.header-top -->
</div><!-- /.header -->
